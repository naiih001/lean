[package]
name = "lean"
version = "0.2.0"
edition = "2021"
description = "Light, fast autonomous coding assistant — single native binary, TUI-first"
repository = "https://github.com/naiih001/lean"
homepage = "https://github.com/naiih001/lean"
readme = "README.md"
license = "MIT"
keywords = ["tui", "ai", "coding-assistant", "llm", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.78"
exclude = [".env", ".lean/", ".hermes/"]

[dependencies]
shlex = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = "0.1"
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
dirs = "6"
walkdir = "2"
ratatui = "0.30"
crossterm = "0.28"
ratatui-textarea = "0.9"
gray_matter = "0.3"
anyhow = "1"
async-stream = "0.3"
base64 = "0.22"
similar = { version = "2", features = ["text"] }
wildmatch = "2"
rmcp = { version = "3.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
http = "1"
